<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>은하 무역 연합</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/firebase@10.14.1/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.14.1/firebase-database-compat.js"></script>
<style>
/* 레이아웃: 관제실 콘솔 — 별이 흐르는 우주 위 패널, 행성마다 성운 색, 숫자는 계기판 서체 */
:root{
  --void:#0b0f1d; --panel:#141a2eee; --panel2:#1c2440; --line:#2b3558;
  --ink:#e8ecf8; --mute:#8a93b3; --signal:#ffcf4a; --good:#4fd18b; --bad:#ff6b6b;
  --volcano:#ff8a4c; --aqua:#38c6e8; --terra:#7ad06a; --frost:#b9a8ff;
  --f-display:"Black Han Sans","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background-color:var(--void);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body{padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background-image:radial-gradient(ellipse 60% 50% at 12% 8%,#6a4fc026,transparent 70%),radial-gradient(ellipse 55% 45% at 88% 85%,#1f6fa026,transparent 70%);background-attachment:fixed}
body[data-neb=volcano]{background-image:radial-gradient(ellipse 70% 55% at 10% 0%,#ff6a2e33,transparent 70%),radial-gradient(ellipse 55% 45% at 90% 90%,#a0303026,transparent 70%)}
body[data-neb=aqua]{background-image:radial-gradient(ellipse 70% 55% at 10% 0%,#38c6e82e,transparent 70%),radial-gradient(ellipse 55% 45% at 90% 90%,#1f4fa033,transparent 70%)}
body[data-neb=terra]{background-image:radial-gradient(ellipse 70% 55% at 10% 0%,#7ad06a26,transparent 70%),radial-gradient(ellipse 55% 45% at 90% 90%,#2f6fd02e,transparent 70%)}
body[data-neb=frost]{background-image:radial-gradient(ellipse 70% 55% at 10% 0%,#b9a8ff33,transparent 70%),radial-gradient(ellipse 55% 45% at 90% 90%,#7fd0ff22,transparent 70%)}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;letter-spacing:.01em;text-wrap:balance}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.label{font-size:12px;letter-spacing:.08em;color:var(--mute);text-transform:uppercase}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 auto}
button{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer}
button:hover{border-color:var(--mute)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
button.primary{background:var(--signal);color:#1a1405;border-color:var(--signal);font-weight:700}
button.good{background:var(--good);color:#06210f;border-color:var(--good);font-weight:700}
button.danger{border-color:var(--bad);color:var(--bad)}
button.on{background:var(--signal);color:#1a1405;border-color:var(--signal)}
button:disabled{opacity:.4;cursor:not-allowed}
input,select{font:inherit;color:var(--ink);background:var(--void);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
input[type=number]{width:64px;font-family:var(--f-num)}
.muted{color:var(--mute)}
.small{font-size:13px}
.tag-volcano{color:var(--volcano)}.tag-aqua{color:var(--aqua)}.tag-terra{color:var(--terra)}.tag-frost{color:var(--frost)}
.bd-volcano{border-left:4px solid var(--volcano)}.bd-aqua{border-left:4px solid var(--aqua)}.bd-terra{border-left:4px solid var(--terra)}.bd-frost{border-left:4px solid var(--frost)}
.up{color:var(--good)}.down{color:var(--bad)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--panel2);border:1px solid var(--line);padding:10px 18px;border-radius:10px;z-index:120;max-width:calc(100% - 32px)}
.toast.bad{border-color:var(--bad)}
.toast.ok{border-color:var(--good)}
table{border-collapse:collapse;width:100%}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:12px;color:var(--mute);font-weight:500}
.scroll{overflow-x:auto}

/* 아이콘 · 행성 */
.ico{width:1.15em;height:1.15em;vertical-align:-.2em;display:inline-block;flex:none}
.gd{white-space:nowrap;margin-right:4px}
.pdot{display:inline-block;width:.85em;height:.85em;border-radius:50%;vertical-align:-.08em}
.pd-volcano{background:radial-gradient(circle at 35% 35%,#ffb27a,#c2410c 55%,#3b1512);box-shadow:0 0 6px #ff8a4c88}
.pd-aqua{background:radial-gradient(circle at 35% 35%,#9be7ff,#1670b0 55%,#0a2f55);box-shadow:0 0 6px #38c6e888}
.pd-terra{background:radial-gradient(circle at 35% 35%,#b5f0a8,#3f8a3c 45%,#1b5ca6 75%);box-shadow:0 0 6px #7ad06a88}
.pd-frost{background:radial-gradient(circle at 35% 35%,#fff,#c7d1ee 50%,#6c6aa8);box-shadow:0 0 6px #b9a8ff88}
.planet{display:block;overflow:visible}
.spin{animation:spin linear infinite}
@keyframes spin{to{transform:translateX(-80px)}}
.twk{animation:twk 3s ease-in-out infinite}
@keyframes twk{50%{opacity:.35}}
.steam{animation:steam 2.6s ease-out infinite;opacity:0}
.steam.d2{animation-delay:.9s}.steam.d3{animation-delay:1.7s}
@keyframes steam{0%{transform:translateY(0) scale(.6);opacity:.7}100%{transform:translateY(-20px) scale(1.6);opacity:0}}
.rot{animation:rot 3s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3.2s ease-in-out infinite}
.sway.d2{animation-delay:-1.1s}.sway.d3{animation-delay:-2s}
@keyframes sway{50%{transform:rotate(7deg)}}
.pulse{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.wave{animation:wave 4s ease-in-out infinite}
.wave.d2{animation-duration:5.5s;animation-direction:reverse}
@keyframes wave{50%{transform:translateX(-12px)}}
body.lowfx *,body.lowfx *::before,body.lowfx *::after{animation:none!important;transition:none!important}
body.lowfx .steam{opacity:.35}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.steam{opacity:.35}}

/* 시작 화면 */
.landing{min-height:70vh;display:grid;place-items:center;text-align:center}
.landing h1{font-size:clamp(34px,7vw,64px);line-height:1.05}
.landing .sub{color:var(--signal);font-family:var(--f-display);font-size:clamp(18px,3vw,24px)}
.landing .choices{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:28px}
.landing .choices button{padding:16px 26px;font-size:17px}
.planet-row{display:flex;gap:clamp(8px,3vw,28px);justify-content:center;flex-wrap:wrap;margin-bottom:18px}
.credit{margin-top:32px;font-size:13px;color:var(--mute)}

/* 전광판 */
.board-top{display:flex;gap:16px;flex-wrap:wrap;align-items:stretch}
.board-top>.grow{flex:1 1 420px;min-width:0}
.ctrl{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;box-shadow:0 6px 18px #0008;background:#141a2ef7}
.wait{color:var(--signal)}
.code-box{background:var(--panel2);border:1px solid var(--signal);border-radius:10px;padding:10px 18px;text-align:center}
.code-box .num{font-size:40px;color:var(--signal);letter-spacing:.12em;line-height:1.1}
.phase-title{font-size:clamp(24px,3.5vw,36px)}
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.tcard{background:#0b0f1d99;border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.tcard .score{font-size:22px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--mute)}
.dot.live{background:var(--good)}
.feed{display:flex;flex-direction:column;gap:6px;max-height:300px;overflow-y:auto}
.feed div{font-size:14px;padding:4px 0;border-bottom:1px dashed var(--line)}
.cols{display:grid;grid-template-columns:2fr 1fr;gap:16px}
@media (max-width:900px){.cols{grid-template-columns:1fr}}

/* 은하 지도 */
.galaxy{position:relative;height:380px;border-radius:12px;overflow:hidden;background:radial-gradient(ellipse at 50% 50%,#1a2350,#070a16 78%);border:1px solid var(--line)}
@media (max-width:640px){.galaxy{height:460px}}
.gx-canvas{position:absolute;inset:0;width:100%;height:100%}
.gx-planet{position:absolute;transform:translate(-50%,-50%);text-align:center;pointer-events:none}
.gx-planet .nm{font-family:var(--f-display);font-size:15px;position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);text-shadow:0 2px 6px #000,0 0 2px #000;white-space:nowrap}
.gx-badge{position:absolute;transform:translate(-50%,-50%);padding:2px 8px;border-radius:999px;background:#0b0f1de6;border:2px solid currentColor;font-size:12px;text-align:center;line-height:1.3;white-space:nowrap}
.gx-badge b{font-family:var(--f-num);color:var(--ink)}
.gx-badge.off{border-style:dashed;opacity:.7}
.gx-status{position:absolute;left:12px;top:10px;font-size:13px;background:#0b0f1dd9;padding:4px 12px;border-radius:999px;border:1px solid var(--line)}

/* 연출 화면 */
.cine{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:radial-gradient(ellipse at center,#141a2ef0,#05070ef8);padding:24px max(16px,env(safe-area-inset-left,0px));text-align:center;cursor:pointer;animation:cineIn .7s ease;overflow:auto}
.cine .ci-icon{font-size:60px;line-height:1}
.cine .ci-round{color:var(--signal);letter-spacing:.25em;font-size:14px;margin-top:10px}
.cine h2{font-size:clamp(40px,8vw,88px);line-height:1.05;margin:6px 0}
.cine .ci-tag{font-family:var(--f-display);font-size:clamp(18px,3vw,28px);color:var(--signal)}
.cine p{max-width:660px;margin:16px auto 0;font-size:clamp(15px,2vw,20px);line-height:1.75}
.cine .ci-rule{margin-top:18px;display:inline-block;padding:6px 16px;border:1px solid var(--line);border-radius:999px;background:#0b0f1d}
.cine .ci-skip{margin-top:24px;font-size:13px;color:var(--mute)}
.cine.alarm{background:radial-gradient(ellipse at center,#3a0d12f0,#120406f8);animation:cineIn .3s ease,alarmFlash .9s ease-in-out 5}
.cine.alarm .ci-round{color:var(--bad)}
@keyframes alarmFlash{50%{box-shadow:inset 0 0 0 10px #ff3b3b,inset 0 0 140px #ff3b3b77}}
@keyframes cineIn{from{opacity:0;transform:scale(1.05)}}
.cine.out{opacity:0;transition:opacity .5s}
.ev-art{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:24px;margin-bottom:6px}
.meteor{position:absolute;left:50%;top:50%;width:80px;height:4px;border-radius:4px;background:linear-gradient(90deg,transparent,#ffd29a,#fff);animation:meteor 1.5s ease-in infinite}
@keyframes meteor{0%{transform:translate(60px,-90px) rotate(125deg);opacity:0}25%{opacity:1}100%{transform:translate(-20px,0) rotate(125deg);opacity:0}}
.ev-glow{position:absolute;inset:-8px;border-radius:50%;box-shadow:0 0 50px 14px #7fd0ff;animation:pulse 1.2s ease-in-out infinite}
.barrier{font-size:44px}

/* 학생 화면 */
.stu{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.planet-head{display:flex;gap:14px;align-items:center}
.ph-planet{flex:none}
.banner{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.banner.quiet{border-color:var(--signal)}
.inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.inv div{background:var(--void);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.inv .num{font-size:22px}
.goods-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.goods-grid label{display:flex;justify-content:space-between;align-items:center;gap:6px;background:var(--void);border:1px solid var(--line);border-radius:8px;padding:4px 8px}
.offer{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.offer.in{border-color:var(--signal)}
.mission{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.mission.built{border-color:var(--good)}
.mart svg{width:38px;height:38px;display:block}
.big-score{font-size:34px;color:var(--signal)}
.closed{background:#0b0f1d;border:1px dashed var(--line);border-radius:8px;padding:8px 12px;margin:8px 0;color:var(--signal)}

/* 개척지 */
.colony{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);
  background:linear-gradient(180deg,var(--sky1),var(--sky2) 58%,var(--ground) 58%,var(--ground2));padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.c-volcano{--sky1:#1e0b10;--sky2:#5a1e14;--ground:#3a1a14;--ground2:#1c0c09}
.c-aqua{--sky1:#04122a;--sky2:#0d3a66;--ground:#0e4f7a;--ground2:#082f4f}
.c-terra{--sky1:#061430;--sky2:#1d4f7a;--ground:#2f5a2a;--ground2:#1a3418}
.c-frost{--sky1:#10142b;--sky2:#3a4370;--ground:#b8c3e6;--ground2:#8591bd}
.zone{background:#0b0f1dd0;border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;min-width:0}
.bart{width:100%;max-width:200px}
.bart svg{width:100%;height:auto;display:block;overflow:visible}
.zname{font-family:var(--f-display);font-size:16px}
.workers{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;min-height:32px;align-items:flex-end}
.wk{padding:0;border:0;background:none;width:22px;height:30px;display:inline-block}
button.wk{cursor:pointer}
button.wk:hover svg{filter:drop-shadow(0 0 4px #fff)}
.wk svg{width:22px;height:30px;display:block}
.wk.busy svg{animation:bob 1s ease-in-out infinite}
.wk:nth-child(2n) svg{animation-delay:-.5s}
@keyframes bob{50%{transform:translateY(-3px)}}
.zprod{font-size:24px;line-height:1.1}
.zbtn{display:flex;gap:10px}
.zbtn button{width:46px;height:40px;font-size:22px;padding:0;line-height:1}
.lockbar,.built-strip{grid-column:1/-1}
.lockbar{background:#0b0f1de6;border:1px dashed var(--signal);border-radius:8px;padding:8px 12px;color:var(--signal);text-align:center}
.built-strip{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.built-strip .bs{display:flex;align-items:center;gap:6px;background:#0b0f1dd0;border:1px solid var(--good);border-radius:999px;padding:2px 10px 2px 4px;font-size:13px}
.built-strip .bs svg{width:30px;height:30px}
@media (max-width:480px){.colony{gap:8px;padding:10px}.zone{padding:8px}.zbtn button{width:40px}.zname{font-size:14px}}
@media (max-width:700px){.ctrl{position:static}}

/* 분석 */
.strip{position:relative;height:120px;margin:10px 8px 34px;border-bottom:2px solid var(--line)}
.strip .mk{position:absolute;bottom:-30px;transform:translateX(-50%);font-size:12px;text-align:center;white-space:nowrap}
.strip .mk::before{content:"";display:block;width:2px;height:120px;margin:0 auto 4px;position:absolute;bottom:30px;left:50%;opacity:.5;background:currentColor}
.strip .tr{position:absolute;width:12px;height:12px;border-radius:50%;transform:translate(-50%,50%);background:var(--signal);border:2px solid var(--void)}
.bar{height:10px;border-radius:4px;background:var(--signal);min-width:2px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
</style>
</head>
<body>
<div id="app" class="wrap"></div>
<div id="toast" class="toast" hidden></div>

<script>
const VERSION='v0.6.1';
/* ===================== 게임 데이터 ===================== */
const WORKERS = 12;
const GOODS = ['E','F','crystal','pearl','chip','core'];
const G = {
  E:{n:'에너지',i:'⚡'}, F:{n:'식량',i:'🌱'},
  crystal:{n:'화염 결정석',i:'💎'}, pearl:{n:'심해 진주',i:'🐚'},
  chip:{n:'전자 제품',i:'💻'}, core:{n:'냉각 코어',i:'❄️'}
};
const TYPES = {
  volcano:{n:'볼카노',i:'🌋',desc:'지열 에너지가 솟아오르는 화산 행성',rate:{E:3,F:1},spec:'crystal'},
  aqua:{n:'아쿠아',i:'🌊',desc:'끝없는 바다 농장을 가진 해양 행성',rate:{E:1,F:3},spec:'pearl'},
  terra:{n:'테라',i:'🌍',desc:'기술과 인프라가 가장 앞선 개척 본부',rate:{E:4,F:4},spec:'chip'},
  frost:{n:'프로스트',i:'🧊',desc:'춥고 척박한 얼음 행성',rate:{E:1,F:2},spec:'core'}
};
const TYPECOL={volcano:'#ff8a4c',aqua:'#38c6e8',terra:'#7ad06a',frost:'#b9a8ff'};
const MISSIONS = {
  station:{n:'우주 정거장',need:{crystal:1,core:1}},
  lab:{n:'해저 연구소',need:{pearl:1,chip:1}},
  elevator:{n:'궤도 엘리베이터',need:{chip:1,core:1,crystal:1}},
  server:{n:'양자 냉각 서버',need:{core:2,chip:1}},
  farm:{n:'돔 온실 농장',need:{pearl:1,core:1}},
  forge:{n:'핵융합 용광로',need:{crystal:2,pearl:1}}
};
const BUILD_BONUS = 0.3;   // 건물 1개당 생활지수 +30%
const SPEC_PER_ROUND = 2;
const MAX_PER_SIDE = 40;
const ROUNDS = [null,
  {n:'고립 시대',tag:'워프 폭풍',icon:'🌀',trade:false,lock:false,
   story:'거대한 워프 폭풍이 은하를 덮쳤다. 행성 사이의 통신과 항로가 모두 끊겼다. 각 행성은 스스로 살아남아야 한다.',
   rule:'교역 불가 · 일꾼 배치 자유'},
  {n:'교환 시대',tag:'외부 통신 재개',icon:'📡',trade:true,lock:true,
   story:'폭풍이 걷히고 외부 통신이 재개되었다. 화물선이 다시 뜬다. 하지만 발전소와 농장의 설비 전환 공사가 끝나지 않아 일꾼 배치는 바꿀 수 없다.',
   rule:'교역 가능 · 일꾼 배치 고정'},
  {n:'특화 시대',tag:'은하 무역 연합 결성',icon:'🤝',trade:true,lock:false,
   story:'은하 무역 연합이 결성되고 설비 전환 공사가 끝났다. 이제 무엇을 만들고 무엇을 사 올지 자유롭게 정할 수 있다.',
   rule:'교역 가능 · 일꾼 배치 자유'},
  {n:'격변 시대',tag:'긴급 상황 발령',icon:'⚠️',trade:true,lock:false,
   story:'은하 곳곳에서 긴급 상황이 보고되고 있다. 바뀐 상황에 맞춰 개척지를 다시 정비하라.',
   rule:'교역 가능 · 일꾼 배치 자유 · 사건 발생'}
];
const EVENTS = {
  meteor:{n:'☄️ 운석 충돌',d:'아쿠아 행성 식량 생산력 절반',

/* ===================== 계산 ===================== */
function rates(S,team){
  const r = {...TYPES[team.type].rate};
  if(S.events.meteor && team.type==='aqua') r.F *= 0.5;
  if(S.events.tech && team.type==='frost') r.E *= 3;
  return r;
}
function production(S,team,wE){
  const r = rates(S,team);
  return {E:Math.floor(wE*r.E), F:Math.floor((WORKERS-wE)*r.F)};
}
function life(inv){ return (inv.E||0)*(inv.F||0); }
function scoreOf(inv,built){ return Math.round(life(inv)*(1+BUILD_BONUS*built)); }
// 성장률 기준: 그 행성이 무역 없이 혼자서 낼 수 있는 최고 생활지수(사건 없는 기본 생산력)
function autarkyMax(type){ const r=TYPES[type].rate; let m=0; for(let w=0;w<=WORKERS;w++){ m=Math.max(m,Math.floor(w*r.E)*Math.floor((WORKERS-w)*r.F)); } return Math.max(1,m); }
function baseLine(team){ return autarkyMax(team.type); }
function growth(team,score){ if(!team.prodNow&&!team.hist[1]) return null; return Math.round(score/baseLine(team)*100); }
function blocked(S,a,b){
  if(!S.events.wall) return false;
  const s=[a.type,b.type].sort().join('-');
  return s==='aqua-volcano';
}
function sumGoods(o){ return GOODS.reduce((s,k)=>s+(o[k]||0),0); }
function hasGoods(inv,o){ return GOODS.every(k=>(inv[k]||0)>=(o[k]||0)); }
function cleanGoods(o){ const r={}; GOODS.forEach(k=>{const v=Math.max(0,Math.floor(Number(o&&o[k])||0)); if(v) r[k]=v;}); return r; }
function fmt(o){ const p=GOODS.filter(k=>o[k]).map(k=>`<span class="gd" title="${G[k].n}">${ic(k)}${o[k]}</span>`); return p.length?p.join(''):'없음'; }
function applyTrade(inv,give,get){ const n={...inv}; GOODS.forEach(k=>{n[k]=(n[k]||0)-(give[k]||0)+(get[k]||0);}); return n; }
function tradeReason(st){
  const R=ROUNDS[st.round]||{};
  if(st.phase==='trade'&&R.trade) return null;
  if(!R.trade) return '📡 통신 두절: 워프 폭풍 때문에 다른 행성과 연락할 수 없습니다.';
  if(st.phase==='plan') return '🚀 화물선 출항 준비 중: 일꾼 배치가 확정되면 항로가 열립니다.';
  if(st.phase==='result') return '📦 보급 정산 중: 항로가 잠시 닫혔습니다.';
  return '항로가 닫혀 있습니다.';
}

function assignTeams(n){
  const order = n<4 ? ['volcano','aqua','frost'].slice(0,Math.max(2,n)) : ['volcano','aqua','terra','frost'];
  const counts={}, teams=[];
  for(let i=0;i<n;i++){
    const type=order[i%order.length];
    counts[type]=(counts[type]||0)+1;
    const k=counts[type];
    const elig=Object.keys(MISSIONS).filter(m=>!MISSIONS[m].need[TYPES[type].spec]);
    const missions=[elig[(k-1)%elig.length], elig[k%elig.length]];
    teams.push({id:i+1,type,name:TYPES[type].n+' '+k+'호',workersE:6,
      inv:{E:0,F:0,crystal:0,pearl:0,chip:0,core:0},missions,built:[],hist:{}});
  }
  return teams;
}

/* ===================== 교사(호스트) 상태와 규칙 ===================== */
function newState(code){
  return {code,round:0,phase:'lobby',teams:[],offers:[],trades:[],world:{},
    events:{meteor:false,wall:false,tech:false},quiet:false,seq:1,atab:'cap'};
}
let S=null;

function hostAction(a){
  switch(a.t){
    case 'start':{
      const n=Math.min(30,Math.max(2,Math.floor(a.n)||2));
      S.teams=assignTeams(n); S.round=1; S.phase='plan'; S.offers=[]; S.trades=[]; S.world={};
      return;
    }
    case 'confirm':{ // 생산 확정
      if(S.phase!=='plan') return;
      let wE=0,wF=0;
      S.teams.forEach(t=>{
        const p=production(S,t,t.workersE);
        t.inv.E=p.E; t.inv.F=p.F;
        t.inv[TYPES[t.type].spec]+=SPEC_PER_ROUND;
        t.prodNow={...p,wE:t.workersE};
        wE+=p.E; wF+=p.F;
      });
      S.world[S.round]={E:wE,F:wF};
      S.phase='trade';
      return;
    }
    case 'end':{ // 라운드 결산
      if(S.phase!=='trade') return;
      S.offers.forEach(o=>{ if(o.status==='pending') o.status='expired'; });
      S.teams.forEach(t=>{
        const l=life(t.inv);
        t.hist[S.round]={E:t.inv.E,F:t.inv.F,life:l,score:scoreOf(t.inv,t.built.length),wE:t.prodNow?t.prodNow.wE:t.workersE,
          pE:t.prodNow?t.prodNow.E:0,pF:t.prodNow?t.prodNow.F:0};
      });
      S.phase='result';
      return;
    }
    case 'next':{
      if(S.phase!=='result') return;
      if(S.round>=4){ S.phase='analysis'; return; }
      S.round++; S.phase='plan';
      return;
    }
    case 'analysis': S.phase='analysis'; return;
    case 'back': S.phase = S.round && S.teams[0] && S.teams[0].hist[S.round] ? 'result' : 'plan'; return;
    case 'event': if(EVENTS[a.k]) S.events[a.k]=!S.events[a.k]; return;
    case 'quiet': S.quiet=!S.quiet; return;
    case 'atab': S.atab=a.k; return;
    case 'reset': S=newState(S.code); return;
  }
}

function teamAction(teamId,a){
  const team=S.teams.find(t=>t.id===teamId);
  if(!team) return '행성을 찾을 수 없습니다.';
  const R=ROUNDS[S.round];
  switch(a.t){
    case 'workers':{
      if(S.phase!=='plan') return '지금은 일꾼 배치 시간이 아닙니다.';
      if(R.lock) return '🔧 설비 전환 공사 중이라 이번 라운드는 일꾼 배치를 바꿀 수 없습니다.';
      team.workersE=Math.min(WORKERS,Math.max(0,Math.floor(a.v)||0));
      return null;
    }
    case 'propose':{
      if(S.phase!=='trade'||!R.trade) return tradeReason(S)||'지금은 교역할 수 없습니다.';
      const to=S.teams.find(t=>t.id===Number(a.to));
      if(!to||to.id===team.id) return '거래할 행성을 고르세요.';
      if(blocked(S,team,to)) return '🚧 무역 장벽: 볼카노와 아쿠아는 서로 화물선 입항이 금지되었습니다.';
      const give=cleanGoods(a.give), get=cleanGoods(a.get);
      if(!sumGoods(give)||!sumGoods(get)) return '주는 것과 받는 것이 모두 있어야 합니다. 공짜로 주거나 받는 거래는 안 됩니다.';
      if(sumGoods(give)>MAX_PER_SIDE||sumGoods(get)>MAX_PER_SIDE) return '화물선 한 척에 '+MAX_PER_SIDE+'개까지만 실을 수 있습니다.';
      if(!hasGoods(team.inv,give)) return '우리 창고에 그만큼 없습니다.';
      if(S.offers.filter(o=>o.from===team.id&&o.status==='pending').length>=5) return '대기 중인 제안이 너무 많습니다. 먼저 몇 개를 취소하세요.';
      S.offers.push({id:S.seq++,from:team.id,to:to.id,give,get,status:'pending',round:S.round});
      return null;
    }
    case 'respond':{
      const o=S.offers.find(x=>x.id===a.id);
      if(!o||o.to!==team.id||o.status!=='pending') return '이미 처리된 제안입니다.';
      if(!a.accept){ o.status='rejected'; return null; }
      const from=S.teams.find(t=>t.id===o.from);
      if(S.phase!=='trade') return '항로가 닫혀 거래할 수 없습니다.';
      if(blocked(S,from,team)){ o.status='rejected'; return '🚧 무역 장벽 때문에 체결할 수 없습니다.'; }
      if(!hasGoods(from.inv,o.give)){ o.status='failed'; return from.name+'의 재고가 부족해 체결에 실패했습니다.'; }
      if(!hasGoods(team.inv,o.get)) return '우리 창고에 상대가 원하는 만큼이 없습니다.';
      from.inv=applyTrade(from.inv,o.give,o.get);
      team.inv=applyTrade(team.inv,o.get,o.give);
      o.status='done';
      S.trades.push({id:o.id,round:S.round,from:from.id,to:team.id,give:o.give,get:o.get});
      return null;
    }
    case 'cancel':{
      const o=S.offers.find(x=>x.id===a.id);
      if(o&&o.from===team.id&&o.status==='pending') o.status='cancelled';
      return null;
    }
    case 'build':{
      if(S.round<2||S.phase!=='trade') return '건설은 2라운드부터 항로가 열렸을 때 할 수 있습니다.';
      const m=MISSIONS[a.m];
      if(!m||!team.missions.includes(a.m)) return '우리 행성의 미션이 아닙니다.';
      if(team.built.includes(a.m)) return '이미 지었습니다.';
      if(!hasGoods(team.inv,m.need)) return '재료가 부족합니다.';
      GOODS.forEach(k=>{ team.inv[k]-= (m.need[k]||0); });
      team.built.push(a.m);
      return null;
    }
  }
  return '알 수 없는 요청입니다.';
}

function store(k,v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v);}catch(e){ return null; } }
let LOWFX=(()=>{ const v=store('ksi-galaxy-lowfx'); if(v==='1'||v==='0') return v==='1'; try{ return matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){ return false; } })();
function applyFx(){ document.body.classList.toggle('lowfx',LOWFX); }
function toggleFx(){ LOWFX=!LOWFX; store('ksi-galaxy-lowfx',LOWFX?'1':'0'); applyFx(); drawStars(performance.now()); kickGalaxy(); document.querySelectorAll('[data-act="fx"]').forEach(b=>b.textContent=fxLabel()); }
function fxLabel(){ return LOWFX?'✨ 효과 켜기':'✨ 효과 줄이기'; }
let SOUND=store('ksi-galaxy-sound')==='1', AC=null;
function ac(){ if(!AC){ const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; AC=new C(); } if(AC.state==='suspended') AC.resume(); return AC; }
function beep(f,start,dur,type,vol,f2){
  const a=ac(); if(!a) return;
  const o=a.createOscillator(), g=a.createGain(), t=a.currentTime+start;
  o.type=type||'sine'; o.frequency.setValueAtTime(f,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||.12,t+.02); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+dur+.05);
}
function sfx(k){
  if(!SOUND) return;
  try{
    if(k==='trade'){ beep(660,0,.16,'triangle',.14); beep(990,.12,.3,'triangle',.14); }
    if(k==='round'){ beep(110,0,1.3,'sawtooth',.05,220); beep(330,.4,.9,'sine',.1,495); beep(660,.9,1,'sine',.08); }
    if(k==='alarm'){ for(let i=0;i<4;i++){ beep(620,i*.46,.23,'square',.05,880); beep(880,i*.46+.23,.23,'square',.05,620); } }
  }catch(e){}
}

/* 배경 별 */
const STARS={c:null,list:[],last:0,d:1};
function startStars(){
  const c=document.createElement('canvas'); c.id='stars'; document.body.prepend(c); STARS.c=c;
  STARS.list=Array.from({length:170},()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.3+.3,p:Math.random()*6.3,s:.4+Math.random()*1.2}));
  window.addEventListener('resize',sizeStars); sizeStars(); requestAnimationFrame(starLoop);
}
function sizeStars(){ const d=Math.min(2,window.devicePixelRatio||1); STARS.d=d; STARS.c.width=innerWidth*d; STARS.c.height=innerHeight*d; drawStars(performance.now()); }
function drawStars(now){
  const c=STARS.c; if(!c) return; const x=c.getContext('2d'); x.setTransform(STARS.d,0,0,STARS.d,0,0); x.clearRect(0,0,innerWidth,innerHeight);
  x.fillStyle='#fff';
  for(const s of STARS.list){ x.globalAlpha=LOWFX?.55:.25+.5*(1+Math.sin(now/1000*s.s+s.p))/2; x.beginPath(); x.arc(s.x*innerWidth,s.y*innerHeight,s.r,0,6.283); x.fill(); }
  x.globalAlpha=1;
}
function starLoop(now){ if(!LOWFX&&!document.hidden&&now-STARS.last>70){ STARS.last=now; drawStars(now); } requestAnimationFrame(starLoop); }

function showCine(html,cls,ms){
  const old=document.querySelector('.cine'); if(old) old.remove();
  const d=document.createElement('div'); d.className='cine '+(cls||''); d.setAttribute('role','dialog'); d.setAttribute('aria-live','polite');
  d.innerHTML=`<div>${html}<div class="ci-skip">화면을 누르면 닫힙니다</div></div>`;
  const close=()=>{ if(!d.isConnected) return; d.classList.add('out'); setTimeout(()=>d.remove(),500); };
  d.addEventListener('click',close); document.body.appendChild(d);
  clearTimeout(cineTimer); cineTimer=setTimeout(close,ms||8000);
}

function updateCompPreview(root){
  const el=root.querySelector('[data-cprev]'); if(!el) return;
  const st=root._st, team=teamById(st,root._team); if(!team) return;
  const give=cleanGoods(comp.give), get=cleanGoods(comp.get);
  if(!sumGoods(give)&&!sumGoods(get)){ el.innerHTML='<span class="muted">수량을 넣으면 거래 후 점수를 미리 볼 수 있습니다.</span>'; return; }
  const sc=scoreOf(team.inv,team.built.length);
  const after=applyTrade(team.inv,give,get);
  const lack=!hasGoods(team.inv,give);
  const s2=scoreOf(after,team.built.length), d=s2-sc;
  el.innerHTML=lack?'<span class="down">우리 창고에 그만큼 없습니다.</span>':
    `거래 후: ${ic('E')}${after.E} ${ic('F')}${after.F} → 점수 <b class="num">${s2}</b> <b class="num ${d>=0?'up':'down'}">(${d>=0?'▲':'▼'}${Math.abs(d)})</b>`;
}
let wTimer=null;
function onStuInput(e,root){
  const t=e.target;
  if(t.id==='c-to'){ comp.to=t.value; return; }
  if(t.dataset.side){ comp[t.dataset.side][t.dataset.k]=t.value; updateCompPreview(root); }
}
function onStuClick(e,root){
  const b=e.target.closest('[data-act]'); if(!b||!root.contains(b)) return;
  const act=b.dataset.act, id=Number(b.dataset.id);
  if(act==='wadd'||act==='wmove'){
    const st=root._st, team=teamById(st,root._team), R=ROUNDS[st.round]||{};
    if(st.phase!=='plan'||R.lock){ toast(R.lock&&st.phase==='plan'?'🔧 설비 전환 공사 중이라 일꾼 배치를 바꿀 수 없습니다.':'지금은 일꾼 배치 시간이 아닙니다.','bad'); return; }
    const cur=curWorkers(root,team);
    const d=act==='wadd'?(b.dataset.z==='E'?1:-1)*Number(b.dataset.d):(b.dataset.z==='E'?-1:1);
    const v=Math.max(0,Math.min(WORKERS,cur+d)); if(v===cur) return;
    root._wPend={v,until:Date.now()+2500};
    updateColony(root,st,team);
    clearTimeout(wTimer); wTimer=setTimeout(()=>root._send({t:'workers',v}),180);
    return;
  }
  if(act==='fx'){ toggleFx(); return; }
  if(act==='propose'){
    root._send({t:'propose',to:comp.to,give:comp.give,get:comp.get},()=>{ comp={to:comp.to,give:{},get:{}}; forceComp(root); toast('🚀 화물선이 제안을 싣고 출발했습니다.','ok'); });
  } else if(act==='accept') root._send({t:'respond',id,accept:true},()=>toast('거래가 체결되었습니다! 화물이 도착했습니다.','ok'));
  else if(act==='reject') root._send({t:'respond',id,accept:false});
  else if(act==='cancel') root._send({t:'cancel',id});
  else if(act==='build') root._send({t:'build',m:b.dataset.m},()=>toast('🏗️ 건설 완료! 점수 +30%','ok'));
  else if(act==='counter'){
    const o=root._st.offers.find(x=>x.id===id); if(!o) return;
    comp={to:String(o.from),give:{...o.get},get:{...o.give}};
    root._send({t:'respond',id,accept:false});
    forceComp(root);
    root.querySelector('[data-sec="comp"]').scrollIntoView({behavior:'smooth',block:'start'});
    toast('조건을 바꿔서 다시 보내세요.');
  }
}
function forceComp(root){ if(document.activeElement) document.activeElement.blur(); studentView(root,root._st,root._team,root._send); }

const GX={el:null,types:'',psize:0,seen:0,ships:[],raf:0,stars:[],centers:{},pos:{},W:0,H:0,d:1};
function galaxyHost(){
  if(!GX.el){
    GX.el=document.createElement('div'); GX.el.className='galaxy';
    GX.el.innerHTML='<canvas class="gx-canvas"></canvas><div class="gx-planets"></div><div class="gx-badges"></div><div class="gx-status"></div>';
    GX.canvas=GX.el.querySelector('canvas'); GX.ctx=GX.canvas.getContext('2d');
    GX.stars=Array.from({length:110},()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.2+.3,p:Math.random()*6.3}));
    if(window.ResizeObserver) new ResizeObserver(()=>layoutGalaxy()).observe(GX.el);
    GX.seen=S.trades.length;
  }
  return GX.el;
}
function layoutGalaxy(){
  const el=GX.el; if(!el||!el.isConnected||!S||!S.teams.length) return;
  const W=el.clientWidth,H=el.clientHeight; if(!W||!H) return;
  const d=Math.min(2,window.devicePixelRatio||1);
  if(GX.W!==W||GX.H!==H||GX.d!==d){ GX.W=W; GX.H=H; GX.d=d; GX.canvas.width=W*d; GX.canvas.height=H*d; }
  const types=[...new Set(S.teams.map(t=>t.type))], n=types.length;
  const cols=W<640?Math.min(2,n):n, rows=Math.ceil(n/cols);
  const cellW=W/cols, cellH=H/rows;
  const psize=Math.round(Math.max(54,Math.min(130,Math.min(cellW,cellH)*.4)));
  types.forEach((k,i)=>{
    const cx=((i%cols)+.5)*cellW, cy=(Math.floor(i/cols)+.5)*cellH + (rows===1?(i%2?1:-1)*H*.05:0);
    GX.centers[k]={x:cx,y:cy,r:psize/2};
  });
  const key=types.join(',');
  const pl=el.querySelector('.gx-planets');
  if(key!==GX.types||psize!==GX.psize){
    GX.types=key; GX.psize=psize;
    pl.innerHTML=types.map(k=>`<div class="gx-planet" data-k="${k}">${planetSVG(k,psize)}<div class="nm tag-${k}">${TYPES[k].n}</div></div>`).join('');
  }
  pl.querySelectorAll('.gx-planet').forEach(p=>{ const c=GX.centers[p.dataset.k]; p.style.left=c.x+'px'; p.style.top=c.y+'px'; });
  GX.pos={};
  types.forEach(k=>{
    const ts=S.teams.filter(t=>t.type===k), c=GX.centers[k];
    const Rx=Math.min(cellW*.46,c.r+40), Ry=Math.min(cellH*.42,(c.r+40)*(rows===1?.75:.8));
    ts.forEach((t,j)=>{
      const a=-Math.PI*.75+j*(2*Math.PI/ts.length);
      GX.pos[t.id]={x:Math.max(34,Math.min(W-34,c.x+Math.cos(a)*Rx)),y:Math.max(16,Math.min(H-16,c.y+Math.sin(a)*Ry)),rx:Rx,ry:Ry,k};
    });
    c.rx=Rx; c.ry=Ry;
  });
  renderBadges();
  drawGalaxy(performance.now());
}
function renderBadges(){
  if(!GX.el) return;
  const online=onlineTeams();
  GX.el.querySelector('.gx-badges').innerHTML=S.teams.map(t=>{
    const p=GX.pos[t.id]; if(!p) return '';
    const sc=scoreOf(t.inv,t.built.length), gr=growth(t,sc);
    return `<div class="gx-badge tag-${t.type} ${online.has(t.id)?'':'off'}" style="left:${p.x}px;top:${p.y}px" title="${t.name}">${t.id} <b>${gr===null?'–':gr+'%'}</b>${t.built.length?' 🏗️'+t.built.length:''}</div>`;
  }).join('');
  const R=ROUNDS[S.round]||{};
  GX.el.querySelector('.gx-status').textContent=!S.round?'':!R.trade?'🌀 워프 폭풍: 모든 항로 두절':S.phase==='trade'?(S.quiet?'🔇 무선 침묵: 원격 통신으로만 교역':'🚀 항로 개방: 화물선 운항 중'):S.phase==='plan'?'🛠 작업 배치 중: 화물선 출항 대기':'📦 보급 정산 중';
}
function spawnShips(tr){
  const now=performance.now(), ft=teamById(S,tr.from), tt=teamById(S,tr.to); if(!ft||!tt) return;
  GX.ships.push({from:tr.from,to:tr.to,t0:now,dur:1800,col:TYPECOL[ft.type]});
  GX.ships.push({from:tr.to,to:tr.from,t0:now+200,dur:1800,col:TYPECOL[tt.type]});
}
function kickGalaxy(){ if(!GX.raf&&GX.el) GX.raf=requestAnimationFrame(gxLoop); }
function gxLoop(now){
  GX.raf=0; if(!GX.el||!GX.el.isConnected||GX.el.offsetParent===null) return;
  drawGalaxy(now);
  if(!LOWFX||GX.ships.length) GX.raf=requestAnimationFrame(gxLoop);
}
function drawGalaxy(now){
  const ctx=GX.ctx, W=GX.W, H=GX.H; if(!ctx||!W) return;
  ctx.setTransform(GX.d,0,0,GX.d,0,0); ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#fff';
  for(const s of GX.stars){ ctx.globalAlpha=LOWFX?.5:.25+.45*(1+Math.sin(now/900+s.p))/2; ctx.fillRect(s.x*W,s.y*H,s.r,s.r); }
  ctx.globalAlpha=1;
  const R=ROUNDS[S.round]||{};
  // 궤도
  ctx.setLineDash([3,6]); ctx.lineWidth=1;
  Object.entries(GX.centers).forEach(([k,c])=>{ if(!c.rx) return; ctx.strokeStyle=TYPECOL[k]; ctx.globalAlpha=.3; ctx.beginPath(); ctx.ellipse(c.x,c.y,c.rx,c.ry,0,0,6.283); ctx.stroke(); });
  ctx.setLineDash([]); ctx.globalAlpha=1;
  // 이번 라운드 항로
  ctx.strokeStyle='#ffcf4a'; ctx.lineWidth=1.2;
  S.trades.filter(t=>t.round===S.round).forEach(t=>{ const a=GX.pos[t.from], b=GX.pos[t.to]; if(!a||!b) return; ctx.globalAlpha=.16; ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); });
  ctx.globalAlpha=1;
  // 워프 폭풍
  if(S.round&&!R.trade){
    const rot=LOWFX?0:now/5000;
    ctx.lineWidth=7; ctx.strokeStyle='#9b7bff';
    for(let i=0;i<8;i++){ ctx.globalAlpha=.07+.02*(i%3); ctx.beginPath(); ctx.ellipse(W/2,H/2,W*.18+i*W*.045,H*.16+i*H*.05,rot+i*.4,0,Math.PI*1.25); ctx.stroke(); }
    ctx.globalAlpha=1;
  }
  // 사건
  const pulse=LOWFX?.6:.45+.35*Math.sin(now/300);
  const vc=GX.centers.volcano, aq=GX.centers.aqua, fr=GX.centers.frost;
  if(S.events.wall&&vc&&aq){
    const mx=(vc.x+aq.x)/2, my=(vc.y+aq.y)/2, dx=aq.x-vc.x, dy=aq.y-vc.y, L=Math.hypot(dx,dy)||1, nx=-dy/L, ny=dx/L;
    ctx.strokeStyle='#ff4d4d'; ctx.lineWidth=4; ctx.setLineDash([8,6]); ctx.globalAlpha=.9;
    ctx.beginPath(); ctx.moveTo(mx-nx*70,my-ny*70); ctx.lineTo(mx+nx*70,my+ny*70); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle='#ff4d4d'; ctx.font='bold 13px "IBM Plex Sans KR",sans-serif'; ctx.textAlign='center'; ctx.fillText('항로 봉쇄',mx,my-76*Math.abs(ny)-6);
    ctx.globalAlpha=1;
  }
  if(S.events.meteor&&aq){ ctx.strokeStyle='#ff4d4d'; ctx.lineWidth=3; ctx.globalAlpha=pulse; ctx.beginPath(); ctx.arc(aq.x,aq.y,aq.r+8,0,6.283); ctx.stroke(); ctx.globalAlpha=1; }
  if(S.events.tech&&fr){ ctx.strokeStyle='#7fd0ff'; ctx.lineWidth=4; ctx.globalAlpha=pulse; ctx.beginPath(); ctx.arc(fr.x,fr.y,fr.r+8,0,6.283); ctx.stroke(); ctx.globalAlpha=1; }
  // 화물선
  GX.ships=GX.ships.filter(sh=>now-sh.t0<sh.dur+450);
  ctx.lineCap='round';
  GX.ships.forEach(sh=>{
    const a=GX.pos[sh.from], b=GX.pos[sh.to]; if(!a||!b) return;
    const t=(now-sh.t0)/sh.dur; if(t<0) return;
    const dx=b.x-a.x, dy=b.y-a.y, cx=(a.x+b.x)/2-dy*.22, cy=(a.y+b.y)/2+dx*.22;
    const P=u=>({x:(1-u)*(1-u)*a.x+2*(1-u)*u*cx+u*u*b.x,y:(1-u)*(1-u)*a.y+2*(1-u)*u*cy+u*u*b.y});
    if(t<=1){
      for(let i=0;i<14;i++){ const p1=P(Math.max(0,t-.3*(i+1)/14)), p2=P(Math.max(0,t-.3*i/14)); ctx.strokeStyle=sh.col; ctx.globalAlpha=(1-i/14)*.85; ctx.lineWidth=3.2*(1-i/14)+.4; ctx.beginPath(); ctx.moveTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y); ctx.stroke(); }
      const h=P(t); ctx.globalAlpha=1; ctx.shadowColor=sh.col; ctx.shadowBlur=14; ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(h.x,h.y,3.8,0,6.283); ctx.fill(); ctx.shadowBlur=0;
    } else {
      const k=(now-sh.t0-sh.dur)/450; ctx.globalAlpha=Math.max(0,1-k); ctx.strokeStyle=sh.col; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(b.x,b.y,8+k*20,0,6.283); ctx.stroke();
    }
    ctx.globalAlpha=1;
  });
}

  const ranked=[...st.teams].map(t=>{const sc=scoreOf(t.inv,t.built.length);return {t,sc,gr:growth(t,sc)};})

  else { pv.innerHTML=''; delete pv.dataset.team; }

  if(st.trades.length<GX.seen) GX.seen=st.trades.length;
  if(st.trades.length>GX.seen){ st.trades.slice(GX.seen).forEach(spawnShips); GX.seen=st.trades.length; sfx('trade'); }

function howTo(){
  return `<div class="panel"><h3>진행 순서</h3><ol class="muted" style="margin:8px 0 0;padding-left:20px">

    <li>라운드마다 '생산 확정' → (항로 개방) → '라운드 종료' 순서로 진행합니다.</li>

    <li>점수 = 에너지 × 식량 × (1 + 건물 수 × 0.3). 순위는 혼자서 낼 수 있는 최고 생활지수 대비 성장률로 매깁니다.</li>
    <li>효과음은 전광판의 효과음 버튼으로 켭니다. 기기가 버벅이면 '효과 줄이기'를 누르세요.</li></ol></div>`;
}
let resetArmed=false, resumeAsk=false;
function onBoardClick(e){
  const b=e.target.closest('[data-h]'); if(!b||!app.contains(b)) return;
  const h=b.dataset.h;
  if(h==='resume'){ resumeAsk=false; boardView(); return; }
  if(h==='fresh'){ resumeAsk=false; previewTeam=null; S=newState(S.code); commit(); return; }
  if(h==='sound'){ SOUND=!SOUND; store('ksi-galaxy-sound',SOUND?'1':'0'); if(SOUND){ ac(); sfx('trade'); } boardView(); return; }
  if(h==='fx'){ toggleFx(); boardView(); return; }
  if(h==='reset'){
    if(!resetArmed){ resetArmed=true; b.textContent='정말 초기화? 한 번 더 누르세요'; setTimeout(()=>{resetArmed=false;},3000); return; }
    resetArmed=false; previewTeam=null;
  }
  const before={round:S.round,events:{...S.events}};
  if(h==='start') hostAction({t:'start',n:Number(document.getElementById('h-n').value)});
  else hostAction({t:h,k:b.dataset.k});
  commit();
  if(S.round!==before.round&&S.phase==='plan'){ roundCine(S.round); sfx('round'); }
  if(h==='event'&&S.events[b.dataset.k]&&!before.events[b.dataset.k]){ alarmCine(b.dataset.k); sfx('alarm'); }
}
let previewTeam=null;
function onBoardChange(e){
  if(e.target.id==='h-pv'){ previewTeam=e.target.value?Number(e.target.value):null; boardView(); }
}
function localSend(teamId){
  return (a,ok)=>{ const err=teamAction(teamId,a); if(err) toast(err,'bad'); else if(ok) ok(); commit(); };
}

    <p class="small muted" style="margin-top:10px">테라는 두 자원 모두 가장 많이 만들지만(절대우위), 무엇을 포기하는지 따지면 다른 행성이 더 싸게 만드는 자원이 있습니다. 특산품 ${ic('crystal')}${ic('pearl')}${ic('core')}는 그 행성에만 있는 <b>천연자원</b>, ${ic('chip')}는 <b>기술</b>로 만든 상품입니다.</p>`;
  }
  if(tab==='life'){

    const avg=(k,r)=>{const ts=st.teams.filter(t=>t.type===k&&t.hist[r]);return ts.length?Math.round(ts.reduce((s,t)=>s+t.hist[r].life,0)/ts.length):0;};
    const max=Math.max(1,...types.flatMap(k=>rounds.map(r=>avg(k,r))));
    h+=`<h2>무역 전과 후, 생활지수는 어떻게 변했나?</h2><p class="muted">행성 유형별 평균 생활지수(에너지 × 식량)입니다.</p>

      const a=tr.give,b=tr.get;
      const only=(o,k)=>GOODS.every(g=>g===k||!o[g]);
      if(only(a,'E')&&only(b,'F')&&a.E&&b.F) return {r:b.F/a.E,tr};
      if(only(a,'F')&&only(b,'E')&&a.F&&b.E) return {r:a.F/b.E,tr};
      return null;}).filter(Boolean);
    const lo=Math.log(0.2),hi=Math.log(5),x=v=>Math.min(100,Math.max(0,(Math.log(v)-lo)/(hi-lo)*100));
    h+=`<h2>에너지 1개는 식량 몇 개와 바뀌었나?</h2><p class="muted">에너지와 식량만 맞바꾼 거래를 교환 비율 위치에 찍었습니다. 세로선은 각 행성이 에너지 1개를 만들 때 포기하는 식량(기회비용)입니다.</p>

      ${pts.map((p,i)=>`<div class="tr" title="에너지 1 = 식량 ${p.r.toFixed(2)}" style="left:${x(p.r)}%;bottom:${12+(i%6)*16}px"></div>`).join('')}</div>

  if(tab==='spec'){
    const r=st.teams.some(t=>t.hist[3])?3:st.teams.some(t=>t.hist[2])?2:1;
    h+=`<h2>${r}라운드에 각 행성은 무엇에 집중했나?</h2><p class="muted">개척민 12명 중 발전소(에너지)에 배치한 비율입니다.</p>
      <div style="display:flex;flex-direction:column;gap:6px;margin-top:10px">${st.teams.map(t=>{const hh=t.hist[r];const w=hh?hh.wE:t.workersE;return `<div class="row"><span class="tag-${t.type}" style="width:150px">${pdot(t.type)} ${t.name}</span>
        <div class="grow" style="background:var(--void);border-radius:4px;height:14px;position:relative;min-width:120px"><div class="bar" style="height:14px;width:${w/WORKERS*100}%;background:var(--${t.type})"></div></div>
        <span class="num small" style="width:110px">${ic('E')}${w} : ${ic('F')}${WORKERS-w}</span><span class="small muted" style="width:120px">${caLabel(t.type,types)}</span></div>`;}).join('')}</div>
      <p class="small muted" style="margin-top:10px">비교우위가 있는 자원 쪽으로 기운 행성일수록 성장률이 높았나요?</p>`;
  }
  return h+'</div>';
}
function caLabel(k,types){
  const r=TYPES[k].rate, mine=r.F/r.E;
  const others=types.filter(x=>x!==k).map(x=>TYPES[x].rate.F/TYPES[x].rate.E);
  if(!others.length) return '-';
  const cheaperE=others.filter(o=>mine<o).length, cheaperF=others.filter(o=>mine>o).length;
  if(cheaperE===others.length) return ic('E')+'에너지';
  if(cheaperF===others.length) return ic('F')+'식량';
  return '상대에 따라 다름';
}

  if(!db){ setNet(typeof firebase==='undefined'?'⚠ 연결 모듈을 불러오지 못했습니다. 한 화면 테스트만 가능합니다.':'⚠ Firebase 연결 정보가 아직 없습니다. 한 화면 테스트만 가능합니다.'); return; }
  setNet('🟡 연결 서버에 접속하는 중…');
  const watch=setTimeout(()=>{ if(!roomRef) setNet('⚠ 연결 서버에 접속하지 못했습니다. 이 컴퓨터의 인터넷이나 학교 방화벽을 확인하세요.'); },12000);
  db.ref('.info/connected').on('value',s=>{ if(roomRef) setNet(s.val()?'🟢 학생 접속 가능':'🟡 연결이 끊겨 다시 접속하는 중…'); });
  claimRoom(S.code).then(()=>clearTimeout(watch));
}
async function claimRoom(code){
  const db=fbDb();
  try{
    const res=await db.ref('rooms/'+code+'/meta').transaction(cur=>{
      if(!cur||cur.host===HOST_ID||Date.now()-(cur.t||0)>ROOM_TTL) return {host:HOST_ID,t:Date.now(),sess:BOARD_SESSION};
      return; // 다른 선생님이 쓰는 방
    });
    if(!res.committed){ S.code=newCode(); commit(); return claimRoom(S.code); }
  }catch(e){ setNet('⚠ 데이터베이스에 접근하지 못했습니다('+(e.code||e.message)+'). 규칙을 확인하세요.'); return; }
  if(roomRef){ roomRef.child('actions').off(); roomRef.child('presence').off(); }
  roomRef=db.ref('rooms/'+code);
  clearInterval(hbTimer); hbTimer=setInterval(()=>roomRef.child('meta/t').set(Date.now()),60000);
  publishState();
  roomRef.child('presence').on('value',s=>{ presence=s.val()||{}; boardView(); });
  roomRef.child('meta/sess').on('value',s=>{ const v=s.val(); if(v&&v!==BOARD_SESSION) stopHere(); });
  roomRef.child('actions').on('child_added',snap=>{ const v=snap.val(); snap.ref.remove(); handleAction(v); });
  setNet('🟢 학생 접속 가능');
  boardView();
}
function stopHere(){
  if(!roomRef) return;
  roomRef.child('actions').off(); roomRef.child('presence').off(); roomRef.child('meta/sess').off(); clearInterval(hbTimer); roomRef=null;
  setNet('⏸ 다른 창에서 전광판이 열려 이 창은 멈췄습니다. 이 창을 닫아 주세요.');
}
function ack(cid,rid,body){ if(roomRef&&cid) roomRef.child('acks/'+cid+'/'+rid).set(clean(body)); }
function handleAction(v){
  if(!v||typeof v!=='object') return;
  if(v.type==='join'){
    if(resumeAsk) return ack(v.cid,v.rid,{joinfail:'선생님이 게임을 준비하는 중입니다. 잠시 후 다시 착륙하세요.'});
    const t=S.teams.find(x=>x.id===Number(v.team));
    if(!t) return ack(v.cid,v.rid,{joinfail:S.teams.length?'없는 팀 번호입니다. 1번부터 '+S.teams.length+'번까지 있습니다.':'선생님이 아직 게임을 시작하지 않았습니다.'});
    return ack(v.cid,v.rid,{joined:t.id});
  }
  if(v.type==='act'){
    const err=resumeAsk?'선생님이 게임을 준비하는 중입니다.':teamAction(Number(v.team),v.act||{});
    ack(v.cid,v.rid,{err:err||''});
    commit();
  }
}

/* ---- 학생 ---- */
const CID=rid8();
let cl={code:'',team:null,st:null,rid:1,cbs:{},room:null,joined:false,conn:null};
function joinView(msg){
  const sv=(()=>{try{return JSON.parse(store('ksi-galaxy-join')||'{}');}catch(e){return {};}})();
  app.innerHTML=`<div class="landing"><div style="width:100%;max-width:420px">
    <div class="planet-row">${Object.keys(TYPES).map(k=>planetSVG(k,56)).join('')}</div>
    <div class="label">식민지 개척단</div><h1 style="font-size:40px">은하 무역 연합</h1>
    <div class="panel" style="margin-top:20px;text-align:left;display:flex;flex-direction:column;gap:12px">
      <label for="j-code">방 코드 (전광판의 4자리)</label><input id="j-code" inputmode="numeric" maxlength="4" value="${sv.code||''}" class="num" style="font-size:24px;letter-spacing:.2em">
      <label for="j-team">우리 팀 번호</label><input id="j-team" type="number" min="1" value="${sv.team||''}" class="num" style="width:100%;font-size:24px">
      <button class="primary" id="j-go">🚀 행성에 착륙하기</button>
      <div class="small ${msg?'down':'muted'}" id="j-msg">${msg||'같은 팀 두 명이 한 기기를 함께 씁니다.'}</div>
    </div></div></div>`;
  $('#j-go').onclick=()=>{
    const code=$('#j-code').value.trim(), team=Number($('#j-team').value);
    if(!/^\d{4}$/.test(code)||!team){ $('#j-msg').textContent='방 코드 4자리와 팀 번호를 입력하세요.'; return; }
    store('ksi-galaxy-join',JSON.stringify({code,team}));
    connect(code,team);
  };
}
function setJoinMsg(t,bad){ const m=$('#j-msg'); if(m){ m.textContent=t; m.className='small '+(bad?'down':'muted'); } }
function leaveRoom(){
  if(cl.room){ cl.room.child('acks/'+CID).off(); cl.room.child('state').off(); cl.room.child('acks/'+CID).remove(); if(cl.joined) cl.room.child('presence/'+CID).remove(); }
  cl.room=null; cl.joined=false;
}
function connect(code,team){
  const db=fbDb();
  if(!db){ joinView(typeof firebase==='undefined'?'연결 모듈을 불러오지 못했습니다. 이 기기의 인터넷 연결을 확인하세요.':'이 게임에 아직 연결 설정이 없습니다. 선생님께 알려주세요.'); return; }
  leaveRoom();
  cl.code=code; cl.team=team;
  let done=false, timer=null;
  const fail=msg=>{ if(done) return; done=true; clearTimeout(timer); leaveRoom(); joinView(msg); };
  setJoinMsg('① 연결 서버에 접속하는 중…');
  timer=setTimeout(()=>fail('① 연결 서버에 접속하지 못했습니다. 이 기기의 인터넷 연결을 확인하세요.'),12000);
  const room=db.ref('rooms/'+code); cl.room=room;
  room.child('meta').once('value').then(s=>{
    if(done) return;
    const m=s.val();
    if(!m||Date.now()-(m.t||0)>ROOM_TTL) return fail('② 방 '+code+'을(를) 찾지 못했습니다. 방 코드가 맞는지, 선생님 전광판에 "🟢 학생 접속 가능"이 떠 있는지 확인하세요.');
    clearTimeout(timer);
    setJoinMsg('② 방 '+code+'에 착륙 허가를 요청하는 중…');
    timer=setTimeout(()=>fail('③ 방 '+code+'의 전광판이 응답하지 않습니다. 선생님 전광판 화면이 열려 있는지 확인하세요.'),15000);
    const joinRid=cl.rid++;
    room.child('acks/'+CID).on('child_added',a=>{
      const v=a.val()||{}, r=Number(a.key); a.ref.remove();
      if(r===joinRid){
        clearTimeout(timer);
        if(v.joinfail){ done=true; leaveRoom(); joinView(v.joinfail); return; }
        done=true; cl.joined=true; cl.team=Number(v.joined)||team;
        const pres=room.child('presence/'+CID);
        db.ref('.info/connected').on('value',c=>{
          if(!cl.joined||cl.room!==room) return;
          if(c.val()){ pres.onDisconnect().remove(); pres.set({team:cl.team,t:Date.now()}); if(cl.conn===false) toast('다시 연결되었습니다.','ok'); cl.conn=true; }
          else if(cl.conn){ cl.conn=false; toast('통신이 끊겼습니다. 다시 연결하는 중…','bad'); }
        });
        room.child('state').on('value',s=>{
          const raw=s.val(); if(!raw) return;
          let st; try{ st=JSON.parse(raw); }catch(e){ return; }
          const prev=cl.st; cl.st=st; renderClient(); clientCine(prev,st);
        });
        return;
      }
      const cb=cl.cbs[r]; delete cl.cbs[r];
      if(v.err) toast(v.err,'bad'); else if(cb) cb();
    });
    room.child('actions').push(clean({type:'join',team,cid:CID,rid:joinRid,t:Date.now()}));
  }).catch(e=>fail('① 연결 서버에 접근하지 못했습니다('+(e.code||e.message)+').'));
}
function clientCine(prev,st){
  if(st.phase==='lobby'||st.phase==='analysis'||!st.round) return;
  if(!prev||prev.round!==st.round){ roundCine(st.round); return; }
  Object.keys(EVENTS).forEach(k=>{ if(st.events[k]&&!prev.events[k]) alarmCine(k); });
}
function clientSend(a,ok){
  if(!cl.room||!cl.joined){ toast('통신이 끊겨 있습니다.','bad'); return; }
  const rid=cl.rid++; if(ok) cl.cbs[rid]=ok;
  cl.room.child('actions').push(clean({type:'act',team:cl.team,cid:CID,rid,act:a,t:Date.now()}));
}
function renderClient(){
  let root=document.getElementById('stu-root');
  if(!root){ app.innerHTML='<div id="stu-root"></div>'; root=document.getElementById('stu-root'); }
  if(cl.st.phase==='lobby'){ root.innerHTML='<div class="panel">선생님이 게임을 시작하기를 기다리는 중…</div>'; root.removeAttribute('data-team'); return; }
  if(!teamById(cl.st,cl.team)){ root.innerHTML='<div class="panel">선생님이 새 게임을 준비하는 중입니다. 잠시만 기다리세요…</div>'; root.removeAttribute('data-team'); return; }
  const t=teamById(cl.st,cl.team); document.body.dataset.neb=t.type;
  studentView(root,cl.st,cl.team,clientSend);
}

/* ===================== 시작 화면 ===================== */
function landing(){
  app.innerHTML=`<div class="landing"><div>
    <div class="planet-row">${Object.keys(TYPES).map(k=>planetSVG(k,84)).join('')}</div>
    <div class="label">통합사회 · 국제 무역과 비교우위</div>
    <h1>식민지 개척단<br>은하 무역 연합</h1>
    <div class="sub" style="margin-top:10px">네 개의 행성, 하나의 은하 시장</div>
    <div class="choices"><button class="primary" id="go-join">🚀 학생으로 참가</button><button id="go-host">🛰️ 교사 전광판 열기</button></div>
    <div class="credit">제작: 신성고 사회과 교사 이석현 · ${VERSION}</div></div></div>`;
  $('#go-join').onclick=()=>{ location.hash='join'; };
  $('#go-host').onclick=()=>{ location.hash='host'; };
}
function route(){
  const h=location.hash.replace('#','');
  if(h==='host'){ if(!S) startHost(); else boardView(); }
  else if(h==='join'){ if(!S) joinView(); }
  else landing();
}
window.addEventListener('hashchange',()=>location.reload());
applyFx(); startStars();
route();
</script>
